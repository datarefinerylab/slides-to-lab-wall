<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabDeck examples</title>
<link rel="stylesheet" href="labdeck/labdeck.css">
<style>
body{margin:0;background:#0b0e14;color:#eef1f5;font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.home{max-width:820px;margin:0 auto;padding:56px 24px 80px}
.home h1{font-size:34px;margin:0 0 6px}
.home p{color:#a8b2c0;margin:0 0 28px}
.home ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.home a{display:flex;justify-content:space-between;gap:16px;padding:16px 18px;border:1px solid #2a313c;border-radius:8px;color:inherit;text-decoration:none}
.home a:hover{border-color:#7fc8f8}
.home small{color:#a8b2c0;white-space:nowrap}
.home code{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#cfe8fb}
</style>
</head>
<body>
<div class="home">
  <h1>LabDeck examples</h1>
  <p>Open a talk to present it. On the lab workstation, open the wall link from any talk's <code>A</code> panel. It looks like <code>…/#w.code</code>.</p>
  <ul>
<!-- talks:start -->
    <li><a href="plain/"><span>Reading Floor Plans at Scale</span><small>plain deck</small></a></li>
    <li><a href="interactive/"><span>How We Review Code</span><small>with audience questions</small></a></li>
<!-- talks:end -->
  </ul>
</div>
<script>window.LABDECK = { title: 'Talks' };</script>
<script src="labdeck/qrcode.js"></script>
<script src="labdeck/labdeck.js"></script>
</body>
</html>
